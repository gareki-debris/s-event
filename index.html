    --text-sub: #5b6578;

    --accent: #096cb8;

  body {

  }
  .hero-label {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    background: rgba(255, 255, 255, .18);
    border-radius: 999px;

  .hero h1 {

  .hero p { margin: 0; font-size: 13px; opacity: .88; }

  /* フィルター */
  .filters {
    position: sticky;
    top: 0;
    z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--border);
    padding-top: 12px;

  .filter-panel {
    background: var(--surface);
    border-radius: 16px 16px 0 0;
  }
  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 4px 16px 12px;
    margin: 0 -16px;
    scroll-snap-type: x proximity;
    scroll-padding-inline: 16px;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    scroll-snap-align: start;
    min-height: 36px;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }
  .chip.all[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
  .t-event { --c: var(--c-event); --ct: var(--c-event-t); }
  .t-greet { --c: var(--c-greet); --ct: var(--c-greet-t); }

  .t-goods { --c: var(--c-goods); --ct: var(--c-goods-t); }
  .t-shop  { --c: var(--c-shop);  --ct: var(--c-shop-t); }
  .chip[class*="t-"] { border: 2px solid var(--c); padding: 6px 13px; }
  .chip[class*="t-"][aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--ct); }
  .result {
    font-size: 12px;
    color: var(--text-sub);
    padding: 0 0 10px;

  .month::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .month:first-child { margin-top: 4px; }

  .card {

    margin-bottom: 12px;
    overflow: hidden;
    border: 1px solid transparent;

  .date {

  .date .d { display: block; font-size: 24px; font-weight: 900; line-height: 1.1; }
  .date .w { display: block; font-size: 11px; font-weight: 700; }

  .badge {

    gap: 4px;
    font-size: 11px;
    font-weight: 700;
    border-radius: 6px;
    padding: 2px 8px;
    line-height: 1.6;
  }

  .title {

    font-size: 16px;
    font-weight: 700;
    line-height: 1.45;
  }
  .title a {
    color: var(--accent);

    text-decoration-thickness: 1.5px;
    text-underline-offset: 4px;

  .title .nw { white-space: nowrap; }
  .title a:hover, .title a:active { text-decoration-color: var(--accent); }
  .title .ext {

    margin-left: 4px;
    vertical-align: -2px;

  .meta {
    display: grid;
    gap: 3px;
    font-size: 13px;
    color: var(--text-sub);
  }
  .meta div { display: grid; grid-template-columns: 16px 1fr; gap: 6px; align-items: start; }
  .meta svg { width: 14px; height: 14px; margin-top: 4px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .maps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .map-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 6px 10px;
    text-decoration: none;
    min-height: 32px;

    margin-top: 10px;

    font-weight: 700;
    color: var(--text);
    background: var(--surface-2);
    border-radius: 10px;
    padding: 8px 10px;

  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tag {
    font-size: 11px;
    font-weight: 700;
    color: var(--ct);
    background: var(--c);
    border-radius: 999px;
    padding: 2px 10px;

    list-style: none;
    cursor: pointer;
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 44px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: "";
    width: 8px; height: 8px;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
    transition: transform .2s;
    margin-right: 4px;
  }
  details[open] summary::after { transform: rotate(-135deg); }
  .detail { padding: 0 16px 16px; font-size: 14px; }

    border: 0;
    background: transparent;

  .cal-day.today .n { background: var(--text); color: var(--bg); }
  .cal-day.sel { background: var(--accent-soft); }

  .cal-bar {

    border: 0;
    font: inherit;

    height: 20px;

    text-align: left;
    white-space: nowrap;
    overflow: hidden;

    cursor: pointer;
    min-width: 0;

  .cal-bar.cl { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: 0; }
  .cal-bar.cr { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: 0; }
  .cal-mark {
    appearance: none;
    font: inherit;
    font-size: 10px;
    font-weight: 700;
    line-height: 17px;
    height: 20px;
    padding: 0;
    margin: 0 2px;
    border: 1.5px solid var(--c);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
    cursor: pointer;
    min-width: 0;
  }
  .cal-mark.sel { outline: 2px solid var(--text); outline-offset: 1px; }
  .cal-bar.sel { outline: 2px solid var(--text); outline-offset: 1px; }
  .cal-note { font-size: 11px; color: var(--text-sub); padding: 8px 6px 0; line-height: 1.6; }
  .lg-solid, .lg-open { display: inline-block; width: 22px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  .lg-solid { background: var(--c-event); }
  .lg-open { border: 1.5px solid var(--c-event); border-radius: 999px; background: var(--surface); }
  .cal-approx { margin: 8px 4px 0; padding-top: 8px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  .cal-approx-ttl { font-size: 11px; font-weight: 700; color: var(--text-sub); }
  .cal-approx-btn {
    appearance: none; font: inherit; font-size: 12px; font-weight: 700; text-align: left;

    padding: 6px 10px; cursor: pointer; line-height: 1.4;
  }
  .cal-approx-btn.sel { outline: 2px solid var(--text); outline-offset: 1px; }
  .cal-panel { scroll-margin-top: 150px; }
</style>

function renderDetail(text) {
  const lines = text.split("\n");
  const items = lines.filter(l => l.startsWith("・")).map(l => `<li>${esc(l.slice(1))}</li>`).join("");
  const notes = lines.filter(l => l.startsWith("※")).map(l => `<p class="note">${esc(l)}</p>`).join("");
  return (items ? `<ul>${items}</ul>` : "") + notes;
}

function mapLinks(ev) {
  if (!ev.maps) return "";
  return '<span class="maps">' + ev.maps.map(m =>
    `<a class="map-link" href="https://www.google.com/maps/search/?api=1&amp;query=${encodeURIComponent(m.q)}" target="_blank" rel="noopener">${ICON_MAP}${esc(m.label || "Googleマップで見る")}</a>`
  ).join("") + "</span>";
}

function card(ev) {
  const s = toDate(ev.start);
  const dateBox = `
    <div class="date" aria-hidden="true">
      <span class="m">${s.getMonth() + 1}月</span>
      <span class="d">${ev.approx ? esc(ev.approx) : s.getDate()}</span>
      <span class="w">${ev.approx ? "頃" : WEEK[s.getDay()]}</span>
      <span class="from">${ev.end || ev.endLabel ? "〜" : ""}</span>
    </div>`;
  const tags = [...ev.tags].sort((a, b) => TAGS.findIndex(t => t.id === a) - TAGS.findIndex(t => t.id === b)).map(t => `<span class="tag ${TAGCLS[t] || ""}">${esc(t)}</span>`).join("");
  return `
  <article class="card">
    <div class="card-main">
      ${dateBox}
      <div>
        <div class="tags">${tags}</div>
        <h2 class="title"><a href="${esc(ev.url)}" target="_blank" rel="noopener">${esc(ev.name.slice(0, -1))}<span class="nw">${esc(ev.name.slice(-1))}<svg class="ext" viewBox="0 0 24 24" aria-label="公式サイトを開く"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></span></a></h2>
        <div class="meta">
          <div>${ICON_CAL}<span>${esc(ev.period).replace(/\n/g, "<br>")}</span></div>
          <div>${ICON_PIN}<span>${esc(ev.place).replace(/\n/g, "<br>")}${mapLinks(ev)}</span></div>
        </div>
        ${ev.greeting ? `<div class="greet-note">グリーティング：${esc(ev.greeting)}</div>` : ""}
      </div>
    </div>
    <details>
      <summary>詳細を見る</summary>
      <div class="detail">
        <h3>概要</h3>
        <p>${esc(ev.summary)}</p>
        <h3>主な内容・特典</h3>
        ${renderDetail(ev.detail)}
        ${ev.sub ? `<div class="links"><a class="btn sub" href="${esc(ev.sub)}" target="_blank" rel="noopener">関連情報を見る</a></div>` : ""}
      </div>
    </details>
  </article>`;
}

// ---------- カレンダー ----------
let view = "list";
try { const v = localStorage.getItem("sonic-view"); if (v === "cal" || v === "list") view = v; } catch (e) {}

const pad = n => String(n).padStart(2, "0");
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const evEnd = ev => toDate(ev.end || ev.start);
const isRange = ev => !!ev.end && ev.end !== ev.start;
const isOpen = ev => !ev.end;                 // 終了日が未定・不明
// 終了日未定イベントは、開始日と関連日（marks）にだけラベルを出す
const openDates = ev => {
  if (ev.approx) return new Map();          // 日付未定（「10月下旬頃」など）は日付ラベルを出さない
  const m = new Map([[ev.start, [ev.startLabel || "開始"]]]);
  (ev.marks || []).forEach(x => m.set(x.date, [...(m.get(x.date) || []), x.label]));
  return m;
};
const primaryCls = ev => { const t = TAGS.find(t => ev.tags.includes(t.id)); return t ? t.cls : "t-event"; };
const dayDiff = (a, b) => Math.round((a - b) / 86400000);
const ymIndex = d => d.getFullYear() * 12 + d.getMonth();

const MIN_YM = Math.min(...EVENTS.map(e => ymIndex(toDate(e.start))));
const MAX_YM = Math.max(...EVENTS.map(e => ymIndex(evEnd(e))));
const NOW = new Date();
let calYM = Math.min(Math.max(ymIndex(NOW), MIN_YM), MAX_YM);
let sel = (ymIndex(NOW) >= MIN_YM && ymIndex(NOW) <= MAX_YM) ? { day: dkey(NOW) } : null;

function calendarHTML(list) {
  const y = Math.floor(calYM / 12), m = calYM % 12;
  const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
  const gridStart = new Date(y, m, 1 - first.getDay());
  const weeks = Math.ceil((first.getDay() + last.getDate()) / 7);
  const todayK = dkey(NOW);
  const selEv = sel && sel.ev != null ? EVENTS[sel.ev] : null;

  let html = `<section class="cal" aria-label="イベントカレンダー">
    <div class="cal-head">
      <button class="cal-nav" data-nav="-1" aria-label="前の月" ${calYM <= MIN_YM ? "disabled" : ""}>◀</button>
      <div class="cal-title">${y}年${m + 1}月</div>
      <button class="cal-nav" data-nav="1" aria-label="次の月" ${calYM >= MAX_YM ? "disabled" : ""}>▶</button>
    </div>
    <div class="cal-dow">${WEEK.map(w => `<div>${w}</div>`).join("")}</div>`;

  for (let w = 0; w < weeks; w++) {
    const ws = new Date(gridStart); ws.setDate(ws.getDate() + w * 7);
    const we = new Date(ws); we.setDate(we.getDate() + 6);

    const wsK = dkey(ws), weK = dkey(we);
    const items = [];
    list.forEach(ev => {
      if (isRange(ev)) {
        if (toDate(ev.start) <= we && evEnd(ev) >= ws)
          items.push({ ev, kind: "bar", a: Math.max(0, dayDiff(toDate(ev.start), ws)), b: Math.min(6, dayDiff(evEnd(ev), ws)) });
        (ev.marks || []).forEach(x => {
          if (x.date < wsK || x.date > weK) return;
          const c = dayDiff(toDate(x.date), ws);
          items.push({ ev, kind: "mark", label: x.label, a: c, b: c });
        });
      } else if (isOpen(ev)) {
        openDates(ev).forEach((labels, k) => {
          if (k < wsK || k > weK) return;
          const c = dayDiff(toDate(k), ws);
          items.push({ ev, kind: "mark", label: labels.join("・"), a: c, b: c });   // 開催日の1マスに収める
        });
      }
    });
    items.sort((x, y) => (x.kind === "mark") - (y.kind === "mark") || toDate(x.ev.start) - toDate(y.ev.start) || (y.b - y.a) - (x.b - x.a) || x.a - y.a);
    const laneEnd = [];
    const bars = items.map(it => {
      const { ev, a, b } = it;
      let lane = laneEnd.findIndex(e => e < a);
      if (lane < 0) { lane = laneEnd.length; laneEnd.push(b); } else laneEnd[lane] = b;
      const on = selEv === ev ? " sel" : "";
      const pos = `grid-column:${a + 1} / ${b + 2};grid-row:${lane + 2}`;
      if (it.kind === "mark") {
        const t = `${it.label}：${ev.name}`;
        return `<button class="cal-mark ${primaryCls(ev)}${on}" data-ev="${EVENTS.indexOf(ev)}" style="${pos}" title="${esc(t + (isOpen(ev) ? "（終了日未定）" : ""))}" aria-label="${esc(t + (isOpen(ev) ? "（終了日未定）" : ""))}">${esc(it.label)}</button>`;
      }
      const cl = toDate(ev.start) < ws ? " cl" : "";
      const cr = evEnd(ev) > we ? " cr" : "";
      return `<button class="cal-bar ${primaryCls(ev)}${cl}${cr}${on}" data-ev="${EVENTS.indexOf(ev)}" style="${pos}" title="${esc(ev.name)}">${esc(ev.name)}</button>`;
    }).join("");

    let days = "";
    for (let i = 0; i < 7; i++) {
      const d = new Date(ws); d.setDate(d.getDate() + i);
      const k = dkey(d);
      const dots = list.filter(ev => !isRange(ev) && !isOpen(ev) && ev.start === k)
        .map(ev => `<i class="dot ${primaryCls(ev)}"></i>`).join("");
      const cls = ["cal-day"];
      if (d.getMonth() !== m) cls.push("other");
      if (k === todayK) cls.push("today");
      if (sel && sel.day === k) cls.push("sel");
      days += `<button class="${cls.join(" ")}" data-day="${k}" style="grid-column:${i + 1}" aria-label="${d.getMonth() + 1}月${d.getDate()}日"><span class="n">${d.getDate()}</span><span class="dots">${dots}</span></button>`;
    }
    html += `<div class="cal-week">${days}${bars}</div>`;
  }
  const approx = list.filter(ev => ev.approx && ymIndex(toDate(ev.start)) === calYM);
  if (approx.length) {
    html += `<div class="cal-approx"><div class="cal-approx-ttl">日付未定（時期のみ発表）</div>` + approx.map(ev =>
      `<button class="cal-approx-btn ${primaryCls(ev)}${selEv === ev ? " sel" : ""}" data-ev="${EVENTS.indexOf(ev)}">${toDate(ev.start).getMonth() + 1}月${esc(ev.approx)}頃：${esc(ev.name)}</button>`).join("") + `</div>`;
  }
  html += `<div class="cal-note"><span class="lg-solid"></span>開催期間　<span class="lg-open"></span>終了日未定のイベント（開始日・関連日のみ、その日のマス内に表示）<br>日付や帯・ラベルをタップすると詳細を表示します。</div></section>`;

  // 選択中の詳細
  html += `<div class="cal-panel" id="calPanel">`;
  if (selEv && list.includes(selEv)) {
    html += `<h2 class="month">選択したイベント</h2>${card(selEv)}`;
  } else if (sel && sel.day) {
    const d = toDate(sel.day);
    const items = list.filter(ev => isOpen(ev) ? openDates(ev).has(sel.day) : toDate(ev.start) <= d && d <= evEnd(ev));
    html += `<h2 class="month">${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()]}）のイベント ${items.length}件</h2>`;
    html += items.length ? items.map(card).join("") : '<p class="empty">この日に開催のイベントはありません</p>';
  } else {
    html += '<p class="empty">日付や帯をタップすると詳細が表示されます</p>';
  }
  return html + `</div>`;
}

function render() {
  const f = FILTERS.find(x => x.id === current);
  const list = EVENTS
    .filter(f.test)
    .sort((a, b) => toDate(a.start) - toDate(b.start));

  document.getElementById("chips").innerHTML = FILTERS.map(x => {
    const n = EVENTS.filter(x.test).length;
    return `<button class="chip ${x.cls || ""}" data-id="${esc(x.id)}" aria-pressed="${x.id === current}">${esc(x.label)} ${n}</button>`;
  }).join("");

  document.getElementById("result").textContent = `${f.label}：${list.length}件`;

  document.querySelectorAll("#viewToggle button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));

  const out = document.getElementById("list");
  if (view === "cal") { out.innerHTML = calendarHTML(list); return; }
  if (!list.length) { out.innerHTML = '<p class="empty">該当するイベントはありません</p>'; return; }

  // 開始月ごとに見出しを付ける
  let html = "", lastGroup = "";
  list.forEach(ev => {
    const s = toDate(ev.start);
    const group = `${s.getFullYear()}年${s.getMonth() + 1}月スタート`;
    if (group !== lastGroup) { html += `<h2 class="month">${group}</h2>`; lastGroup = group; }
    html += card(ev);
  });
  out.innerHTML = html;
}

document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  current = b.dataset.id;
  try { localStorage.setItem("sonic-filter", current); } catch (err) {}
  render();
});

document.getElementById("viewToggle").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  view = b.dataset.view;
  try { localStorage.setItem("sonic-view", view); } catch (err) {}
  render();
});

document.getElementById("list").addEventListener("click", e => {
  if (view !== "cal") return;
  const nav = e.target.closest(".cal-nav");
  const bar = e.target.closest(".cal-bar, .cal-mark, .cal-approx-btn");
  const day = e.target.closest(".cal-day");
  if (nav) {
    calYM = Math.min(Math.max(calYM + Number(nav.dataset.nav), MIN_YM), MAX_YM);
    render();
    return;
  }
  if (bar) sel = { ev: Number(bar.dataset.ev) };
  else if (day) sel = { day: day.dataset.day };
  else return;
  render();
  const panel = document.getElementById("calPanel");
  if (panel) panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
});

render();
</script>
</body>
</html>
