    --text: #eef1f7;

    --border: #2a3244;
    --accent: #5fa9e3;
    --accent-soft: #14283a;
    --accent-text: #0e121a;
    --hero: #0a4f86;
    --greet: #ff7aa8;
    --greet-soft: #3a1b29;
    --prize: #4fd18b;

  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

  .hero {
    background: var(--hero);

    padding: 28px 0 24px;
  }
  .hero-label {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    background: rgba(255, 255, 255, .18);
    border-radius: 999px;
    padding: 3px 10px;
  }
  .hero h1 {
    margin: 10px 0 6px;
    font-size: clamp(24px, 6.4vw, 34px);
    font-weight: 900;
    line-height: 1.3;
  }
  .hero p { margin: 0; font-size: 13px; opacity: .88; }

  /* フィルター */
  .filters {
    position: sticky;
    top: 0;
    z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--border);
    padding-top: 12px;
  }
  .filter-panel {
    background: var(--surface);
    border-radius: 16px 16px 0 0;
  }
  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 4px 16px 12px;
    margin: 0 -16px;
    scroll-snap-type: x proximity;
    scroll-padding-inline: 16px;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    scroll-snap-align: start;
    min-height: 36px;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }
  .chip.greet-chip { color: var(--greet); border-color: var(--greet); }
  .chip.greet-chip[aria-pressed="true"] { background: var(--greet); color: #fff; }
  .chip.prize-chip { color: var(--prize); border-color: var(--prize); }
  .chip.prize-chip[aria-pressed="true"] { background: var(--prize); color: var(--prize-text); }
  .result {

    color: var(--text-sub);
    padding: 0 0 10px;

  .month {

    margin-bottom: 12px;
    overflow: hidden;
    border: 1px solid transparent;

  .card.is-prize { border-color: color-mix(in srgb, var(--prize) 40%, transparent); }

    grid-template-columns: 62px 1fr;
    gap: 14px;
    padding: 16px;

  .date {

    color: var(--accent);
    border-radius: 12px;
    text-align: center;
    padding: 8px 4px;

  .date .d { display: block; font-size: 24px; font-weight: 900; line-height: 1.1; }
  .date .w { display: block; font-size: 11px; font-weight: 700; }
  .date .from { display: block; font-size: 10px; margin-top: 2px; opacity: .8; }
  .card.is-greet .date { background: var(--greet-soft); color: var(--greet); }
  .card.is-prize .date { background: var(--prize-soft); color: var(--prize); }

  .tag-prize { background: var(--prize); color: var(--prize-text); }

  .meta {

  summary::-webkit-details-marker { display: none; }

    content: "";

    border-bottom: 2px solid currentColor;

const WEEK = ["日", "月", "火", "水", "木", "金", "土"];
const toDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const FILTERS = [
  { id: "all", label: "すべて", test: () => true },
  { id: "greet", label: "グリーティング", test: ev => !!ev.greeting, cls: "greet-chip" },
  { id: "prize", label: "プライズ", test: ev => !!ev.prize, cls: "prize-chip" },
  { id: "東京", label: "東京", test: ev => ev.area === "東京" },
  { id: "大阪", label: "大阪", test: ev => ev.area === "大阪" },
  { id: "宮城", label: "宮城", test: ev => ev.area === "宮城" },
  { id: "全国", label: "全国", test: ev => ev.area === "全国" },
  { id: "オンライン", label: "オンライン", test: ev => ev.area === "オンライン" },
  { id: "展示", label: "展示", test: ev => ev.cats.includes("展示") },
  { id: "グッズ", label: "グッズ", test: ev => ev.cats.includes("グッズ") },
];

let current = "all";
try { const saved = localStorage.getItem("sonic-filter"); if (FILTERS.some(f => f.id === saved)) current = saved; } catch (e) {}

const ICON_PIN = '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const ICON_MAP = '<svg viewBox="0 0 24 24"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4zM9 4v14M15 6v14"/></svg>';
const ICON_CAL = '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';

function renderDetail(text) {
  const lines = text.split("\n");
  const items = lines.filter(l => l.startsWith("・")).map(l => `<li>${esc(l.slice(1))}</li>`).join("");
  const notes = lines.filter(l => l.startsWith("※")).map(l => `<p class="note">${esc(l)}</p>`).join("");
  return (items ? `<ul>${items}</ul>` : "") + notes;
}

function mapLinks(ev) {
  if (!ev.maps) return "";
  return '<span class="maps">' + ev.maps.map(m =>
    `<a class="map-link" href="https://www.google.com/maps/search/?api=1&amp;query=${encodeURIComponent(m.q)}" target="_blank" rel="noopener">${ICON_MAP}${esc(m.label || "Googleマップで見る")}</a>`
  ).join("") + "</span>";
}

function card(ev) {
  const s = toDate(ev.start);
  const dateBox = `
    <div class="date" aria-hidden="true">
      <span class="m">${s.getMonth() + 1}月</span>
      <span class="d">${s.getDate()}</span>
      <span class="w">${WEEK[s.getDay()]}</span>
      <span class="from">${ev.end || ev.endLabel ? "〜" : ""}</span>
    </div>`;
  const tags = [ev.area, ...ev.cats].map(t => `<span class="tag">#${esc(t)}</span>`).join("");
  return `
  <article class="card${ev.greeting ? " is-greet" : ""}${ev.prize ? " is-prize" : ""}">
    <div class="card-main">
      ${dateBox}
      <div>
        ${(ev.greeting || ev.prize) ? `<div class="badges">${ev.greeting ? '<span class="badge tag-greet">グリーティング</span>' : ""}${ev.prize ? '<span class="badge tag-prize">プライズ</span>' : ""}</div>` : ""}
        <h2 class="title"><a href="${esc(ev.url)}" target="_blank" rel="noopener">${esc(ev.name.slice(0, -1))}<span class="nw">${esc(ev.name.slice(-1))}<svg class="ext" viewBox="0 0 24 24" aria-label="公式サイトを開く"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></span></a></h2>
        <div class="meta">
          <div>${ICON_CAL}<span>${esc(ev.period).replace(/\n/g, "<br>")}</span></div>
          <div>${ICON_PIN}<span>${esc(ev.place).replace(/\n/g, "<br>")}${mapLinks(ev)}</span></div>
        </div>
        ${ev.greeting ? `<div class="greet-note">グリーティング：${esc(ev.greeting)}</div>` : ""}
        <div class="tags">${tags}</div>
      </div>
    </div>
    <details>
      <summary>詳細を見る</summary>
      <div class="detail">
        <h3>概要</h3>
        <p>${esc(ev.summary)}</p>
        <h3>主な内容・特典</h3>
        ${renderDetail(ev.detail)}
        ${ev.sub ? `<div class="links"><a class="btn sub" href="${esc(ev.sub)}" target="_blank" rel="noopener">関連情報を見る</a></div>` : ""}
      </div>
    </details>
  </article>`;
}

function render() {
  const f = FILTERS.find(x => x.id === current);
  const list = EVENTS
    .filter(f.test)
    .sort((a, b) => toDate(a.start) - toDate(b.start));

  document.getElementById("chips").innerHTML = FILTERS.map(x => {
    const n = EVENTS.filter(x.test).length;
    return `<button class="chip ${x.cls || ""}" data-id="${esc(x.id)}" aria-pressed="${x.id === current}">${esc(x.label)} ${n}</button>`;
  }).join("");

  document.getElementById("result").textContent = `${f.label}：${list.length}件`;

  const out = document.getElementById("list");
  if (!list.length) { out.innerHTML = '<p class="empty">該当するイベントはありません</p>'; return; }

  // 開始月ごとに見出しを付ける
  let html = "", lastGroup = "";
  list.forEach(ev => {
    const s = toDate(ev.start);
    const group = `${s.getFullYear()}年${s.getMonth() + 1}月スタート`;
    if (group !== lastGroup) { html += `<h2 class="month">${group}</h2>`; lastGroup = group; }
    html += card(ev);
  });
  out.innerHTML = html;
}

document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  current = b.dataset.id;
  try { localStorage.setItem("sonic-filter", current); } catch (err) {}
  render();
});


render();
